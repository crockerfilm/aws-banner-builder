<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AWS Banner Studio</title>
<script>
/* Shared banner core — runs in Node (CLI) and the browser (builder).
   One source of truth for layouts, animation presets, and rendering. */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory();
  else root.BannerCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const SIZES = [
    { w:300, h:250, archetype:'box',         label:'Medium Rectangle' },
    { w:970, h:250, archetype:'billboard',   label:'Billboard' },
    { w:728, h:90,  archetype:'leaderboard', label:'Leaderboard' },
    { w:160, h:600, archetype:'skyscraper',  label:'Wide Skyscraper' },
    { w:300, h:600, archetype:'halfpage',    label:'Half Page' },
    { w:320, h:50,  archetype:'mobile',      label:'Mobile Leaderboard' }
  ];

  const LAYOUTS = {
    box:         { mode:'stack', pad:16, hl:20, sub:12.5, proof:10, cta:12.5, showSub:true,  showProof:true,  viz:'corner', useShort:false },
    billboard:   { mode:'split', pad:24, hl:30, sub:15,   proof:11, cta:14,   showSub:true,  showProof:true,  viz:'block',  useShort:false },
    leaderboard: { mode:'bar',   pad:10, hl:15, sub:11,   proof:0,  cta:11,   showSub:true,  showProof:false, viz:'none',   useShort:true  },
    skyscraper:  { mode:'stack', pad:14, hl:18, sub:12,   proof:10, cta:12,   showSub:true,  showProof:true,  viz:'corner', useShort:false },
    halfpage:    { mode:'stack', pad:20, hl:26, sub:14,   proof:11, cta:14,   showSub:true,  showProof:true,  viz:'corner', useShort:false },
    mobile:      { mode:'bar',   pad:8,  hl:12.5, sub:0,  proof:0,  cta:9.5,  showSub:false, showProof:false, viz:'none',   useShort:true  }
  };

  const ANIMATIONS = {
    'fade-up':    { label:'Fade up',       init:'opacity:0;transform:translateY(10px)', played:'opacity:1;transform:none' },
    'fade':       { label:'Fade',          init:'opacity:0',                            played:'opacity:1' },
    'slide-left': { label:'Slide in',      init:'opacity:0;transform:translateX(18px)', played:'opacity:1;transform:none' },
    'scale':      { label:'Scale in',      init:'opacity:0;transform:scale(.92)',       played:'opacity:1;transform:none' },
    'wipe':       { label:'Wipe',          init:'opacity:1;clip-path:inset(0 100% 0 0)',played:'clip-path:inset(0 0 0 0)' },
    'none':       { label:'None (static)', init:'',                                     played:'' }
  };

  const DEFAULT_ANIM = { preset:'fade-up', duration:450, stagger:300, loops:1 };

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function visualSVG(c){
    return '<svg class="viz" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'
      + '<line x1="60" y1="60" x2="22" y2="28" stroke="'+c.hairline+'" stroke-width="2"/>'
      + '<line x1="60" y1="60" x2="98" y2="30" stroke="'+c.hairline+'" stroke-width="2"/>'
      + '<line x1="60" y1="60" x2="20" y2="92" stroke="'+c.hairline+'" stroke-width="2"/>'
      + '<line x1="60" y1="60" x2="100" y2="94" stroke="'+c.hairline+'" stroke-width="2"/>'
      + '<circle cx="22" cy="28" r="6.5" fill="'+c.white+'"/>'
      + '<circle cx="98" cy="30" r="6.5" fill="'+c.white+'"/>'
      + '<circle cx="20" cy="92" r="6.5" fill="'+c.white+'"/>'
      + '<circle cx="100" cy="94" r="6.5" fill="'+c.white+'"/>'
      + '<circle cx="60" cy="60" r="12" fill="'+c.orange+'"/></svg>';
  }

  function renderBanner(ctx){
    const c = ctx.brand.colors;
    const L = LAYOUTS[ctx.size.archetype];
    const size = ctx.size;
    const ct = ctx.content || {};
    const fit = ctx.imageFit || 'contain';
    const click = ctx.click || '#';
    const locale = ctx.locale || 'en';

    const a = Object.assign({}, DEFAULT_ANIM, ctx.anim || {});
    const A = ANIMATIONS[a.preset] || ANIMATIONS['fade-up'];
    const dur = Math.max(0, +a.duration || 0);
    const stag = Math.max(0, +a.stagger || 0);
    const loops = Math.min(3, Math.max(1, +a.loops || 1));

    const headline = L.useShort ? (ct.short || ct.headline || '') : (ct.headline || '');

    const vizInner = ctx.heroDataURI
      ? '<img class="vizimg" src="'+ctx.heroDataURI+'" alt="" style="object-fit:'+fit+'">'
      : visualSVG(c);
    const logoMarkup = ctx.logoDataURI
      ? '<img class="logo-img" src="'+ctx.logoDataURI+'" alt="'+esc(ctx.logoText)+'">'
      : '<span class="logo">'+esc(ctx.logoText)+'</span>';

    const brandbar = '<div class="brandbar region" data-r="0">'+logoMarkup+'<span class="rule"></span></div>';
    const headlineEl = '<h1 class="headline region" data-r="1">'+esc(headline)+'</h1>';
    const subEl  = (L.showSub && ct.subhead) ? '<p class="subhead region" data-r="2">'+esc(ct.subhead)+'</p>' : '';
    const proofEl = (L.showProof && ct.proof) ? '<div class="proof region" data-r="3">'+esc(ct.proof)+'</div>' : '';
    const ctaEl  = '<a class="cta region" data-r="4">'+esc(ct.cta)+' <span class="arw">&rsaquo;</span></a>';
    const corner = (L.viz==='corner') ? '<div class="vizcorner" aria-hidden="true">'+vizInner+'</div>' : '';

    let stage;
    if (L.mode === 'bar') {
      stage = '<div class="stage bar">'+brandbar+'<div class="midcol">'+headlineEl+subEl+'</div>'+ctaEl+'</div>';
    } else if (L.mode === 'split') {
      stage = '<div class="stage split"><div class="textcol">'+brandbar+headlineEl+subEl+proofEl+ctaEl+'</div><div class="vizblock region" data-r="2">'+vizInner+'</div></div>';
    } else {
      stage = '<div class="stage stack">'+corner+'<div class="top">'+brandbar+'</div><div class="mid">'+headlineEl+subEl+proofEl+'</div><div class="bot">'+ctaEl+'</div></div>';
    }

    const transition = dur>0 ? ('opacity '+dur+'ms ease, transform '+dur+'ms ease, clip-path '+dur+'ms ease') : 'none';
    const css = [
      '*{margin:0;padding:0;box-sizing:border-box}',
      'html,body{width:'+size.w+'px;height:'+size.h+'px;overflow:hidden}',
      '#ad{position:relative;width:'+size.w+'px;height:'+size.h+'px;background:'+c.ink+';font-family:'+ctx.brand.fontStack+';color:'+c.white+';cursor:pointer;overflow:hidden;border:1px solid '+c.hairline+'}',
      '.stage{position:absolute;inset:0;padding:'+L.pad+'px;display:flex}',
      '.stage.stack{flex-direction:column;justify-content:space-between}',
      '.stage.split{flex-direction:row;align-items:center;gap:'+L.pad+'px}',
      '.stage.bar{flex-direction:row;align-items:center;gap:'+Math.round(L.pad*0.9)+'px}',
      '.textcol{display:flex;flex-direction:column;gap:'+Math.round(L.pad*0.4)+'px;flex:1}',
      '.mid{display:flex;flex-direction:column;gap:'+Math.round(L.pad*0.45)+'px}',
      '.midcol{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}',
      '.brandbar{display:flex;align-items:center;gap:8px}',
      '.logo{font-weight:800;letter-spacing:-0.5px;font-size:'+Math.max(13,L.hl*0.78)+'px;line-height:1}',
      '.logo-img{height:'+Math.max(14,Math.round(L.hl*0.85))+'px;width:auto;display:block}',
      '.rule{display:inline-block;width:22px;height:3px;background:'+c.orange+';border-radius:2px}',
      '.bar .rule{width:0}',
      '.headline{font-weight:800;letter-spacing:-0.3px;font-size:'+L.hl+'px;line-height:1.1}',
      '.bar .headline{line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
      '.subhead{font-weight:500;font-size:'+L.sub+'px;line-height:1.2;color:#D9DEE5}',
      '.bar .subhead{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
      '.proof{align-self:flex-start;font-weight:700;font-size:'+L.proof+'px;letter-spacing:0.6px;color:'+c.orange+';border:1px solid '+c.orange+';border-radius:2px;padding:3px 7px}',
      '.cta{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;background:'+c.orange+';color:'+c.ink+';font-weight:800;font-size:'+L.cta+'px;padding:'+Math.round(L.cta*0.5)+'px '+Math.round(L.cta*0.9)+'px;border-radius:3px;white-space:nowrap}',
      '.bar .cta{margin-left:auto;align-self:center;flex:none}',
      '.vizblock{width:'+Math.round(size.h*0.62)+'px;height:'+Math.round(size.h*0.62)+'px;flex:none}',
      '.vizcorner{position:absolute;top:'+L.pad+'px;right:'+L.pad+'px;width:'+Math.round(Math.min(size.w,size.h)*0.26)+'px;height:'+Math.round(Math.min(size.w,size.h)*0.26)+'px;opacity:.9}',
      '.viz,.vizimg{width:100%;height:100%;display:block}',
      '.region{'+A.init+';transition:'+transition+'}',
      '#ad.play .region{'+A.played+'}',
      '#ad.play .region[data-r="0"]{transition-delay:'+(0*stag)+'ms}',
      '#ad.play .region[data-r="1"]{transition-delay:'+(1*stag)+'ms}',
      '#ad.play .region[data-r="2"]{transition-delay:'+(2*stag)+'ms}',
      '#ad.play .region[data-r="3"]{transition-delay:'+(3*stag)+'ms}',
      '#ad.play .region[data-r="4"]{transition-delay:'+(4*stag)+'ms}',
      '@media (prefers-reduced-motion: reduce){.region{transition:none}}'
    ].join('\n');

    const js = '(function(){'
      + 'var ad=document.getElementById("ad");'
      + 'ad.addEventListener("click",function(){window.open(window.clickTag,"_blank");});'
      + 'var loops='+loops+',cycle='+((4*stag)+dur+200)+',count=0;'
      + 'function run(){ad.classList.add("play");count++;if(count<loops){setTimeout(function(){ad.classList.remove("play");requestAnimationFrame(function(){requestAnimationFrame(run);});},cycle+600);}}'
      + 'requestAnimationFrame(function(){requestAnimationFrame(run);});})();';

    return '<!doctype html>\n<html lang="'+locale+'">\n<head>\n<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width='+size.w+',height='+size.h+'">\n'
      + '<meta name="ad.size" content="width='+size.w+',height='+size.h+'">\n'
      + '<script type="text/javascript">var clickTag = '+JSON.stringify(click)+';<\/script>\n'
      + '<title>'+esc(ctx.title||'')+'</title>\n<style>'+css+'</style>\n</head>\n<body>\n'
      + '<div id="ad" role="link" aria-label="'+esc(headline)+'">'+stage+'</div>\n'
      + '<script>'+js+'<\/script>\n</body>\n</html>';
  }

  // ---- Freeform layout (Designer page): blocks carry absolute px positions for THIS size ----
  function freeformBlock(b, c) {
    if (b.visible === false) return '';
    const drMap = { logo:0, headline:1, image:2, subhead:2, proof:3, cta:4 };
    const dr = (drMap[b.type] != null) ? drMap[b.type] : 1;
    let s = 'position:absolute;left:'+b.x+'px;top:'+b.y+'px;width:'+b.w+'px;';
    let inner = '';
    if (b.type === 'image') {
      s += 'height:'+b.h+'px;';
      inner = '<img src="'+(b.src||'')+'" alt="" style="width:100%;height:100%;object-fit:'+(b.fit||'contain')+';display:block">';
    } else if (b.type === 'logo') {
      s += 'font-weight:800;letter-spacing:-0.5px;line-height:1;font-size:'+b.fontPx+'px;color:'+(b.color||c.white)+';text-align:'+(b.align||'left')+';';
      inner = esc(b.text);
    } else if (b.type === 'cta') {
      s += 'height:'+b.h+'px;display:flex;align-items:center;justify-content:center;background:'+c.orange+';color:'+c.ink+';font-weight:800;border-radius:3px;font-size:'+b.fontPx+'px;white-space:nowrap;';
      inner = esc(b.text);
    } else if (b.type === 'proof') {
      s += 'font-weight:700;letter-spacing:0.6px;color:'+c.orange+';border:1px solid '+c.orange+';border-radius:2px;padding:3px 7px;font-size:'+b.fontPx+'px;display:inline-block;white-space:nowrap;';
      inner = esc(b.text);
    } else if (b.type === 'subhead') {
      s += 'font-weight:500;line-height:1.2;color:'+(b.color||'#D9DEE5')+';font-size:'+b.fontPx+'px;text-align:'+(b.align||'left')+';';
      inner = esc(b.text);
    } else { // headline / generic text
      s += 'font-weight:800;letter-spacing:-0.3px;line-height:1.1;color:'+(b.color||c.white)+';font-size:'+b.fontPx+'px;text-align:'+(b.align||'left')+';';
      inner = esc(b.text);
    }
    return '<div class="region" data-r="'+dr+'" style="'+s+'">'+inner+'</div>';
  }

  function renderFreeform(ctx) {
    const c = ctx.brand.colors, size = ctx.size;
    const a = Object.assign({}, DEFAULT_ANIM, ctx.anim || {});
    const A = ANIMATIONS[a.preset] || ANIMATIONS['fade-up'];
    const dur = Math.max(0, +a.duration || 0), stag = Math.max(0, +a.stagger || 0), loops = Math.min(3, Math.max(1, +a.loops || 1));
    const click = ctx.click || '#', locale = ctx.locale || 'en';
    const blocksHTML = (ctx.blocks || []).map(b => freeformBlock(b, c)).join('');
    const transition = dur > 0 ? ('opacity '+dur+'ms ease, transform '+dur+'ms ease, clip-path '+dur+'ms ease') : 'none';
    const css = [
      '*{margin:0;padding:0;box-sizing:border-box}',
      'html,body{width:'+size.w+'px;height:'+size.h+'px;overflow:hidden}',
      '#ad{position:relative;width:'+size.w+'px;height:'+size.h+'px;background:'+c.ink+';font-family:'+ctx.brand.fontStack+';color:'+c.white+';cursor:pointer;overflow:hidden;border:1px solid '+c.hairline+'}',
      '.region{'+A.init+';transition:'+transition+'}',
      '#ad.play .region{'+A.played+'}',
      '#ad.play .region[data-r="0"]{transition-delay:'+(0*stag)+'ms}',
      '#ad.play .region[data-r="1"]{transition-delay:'+(1*stag)+'ms}',
      '#ad.play .region[data-r="2"]{transition-delay:'+(2*stag)+'ms}',
      '#ad.play .region[data-r="3"]{transition-delay:'+(3*stag)+'ms}',
      '#ad.play .region[data-r="4"]{transition-delay:'+(4*stag)+'ms}',
      '@media (prefers-reduced-motion: reduce){.region{transition:none}}'
    ].join('\n');
    const js = '(function(){'
      + 'var ad=document.getElementById("ad");'
      + 'ad.addEventListener("click",function(){window.open(window.clickTag,"_blank");});'
      + 'var loops='+loops+',cycle='+((4*stag)+dur+200)+',count=0;'
      + 'function run(){ad.classList.add("play");count++;if(count<loops){setTimeout(function(){ad.classList.remove("play");requestAnimationFrame(function(){requestAnimationFrame(run);});},cycle+600);}}'
      + 'requestAnimationFrame(function(){requestAnimationFrame(run);});})();';
    return '<!doctype html>\n<html lang="'+locale+'">\n<head>\n<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width='+size.w+',height='+size.h+'">\n'
      + '<meta name="ad.size" content="width='+size.w+',height='+size.h+'">\n'
      + '<script type="text/javascript">var clickTag = '+JSON.stringify(click)+';<\/script>\n'
      + '<title>'+esc(ctx.title||'')+'</title>\n<style>'+css+'</style>\n</head>\n<body>\n'
      + '<div id="ad" role="link">'+blocksHTML+'</div>\n'
      + '<script>'+js+'<\/script>\n</body>\n</html>';
  }

  return { SIZES, LAYOUTS, ANIMATIONS, DEFAULT_ANIM, esc, visualSVG, renderBanner, renderFreeform };
});

</script>

<style>
  :root{--ink:#232F3E;--ink2:#2C3A4A;--line:#3B4858;--orange:#FF9900;--muted:#8A95A3;--txt:#EDEFF2}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Helvetica Neue",system-ui,-apple-system,Arial,sans-serif;color:var(--txt);background:#11181F;height:100vh;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--ink);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
  .topbar h1{font-size:14px;margin:0;font-weight:800;letter-spacing:-0.2px}
  .steps{display:flex;gap:6px}
  .step{font-size:12px;border:1px solid var(--line);background:var(--ink2);color:#C7CDD6;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:7px}
  .step.on{background:var(--orange);color:var(--ink);border-color:var(--orange)}
  .step .n{display:inline-flex;width:17px;height:17px;border-radius:50%;background:rgba(0,0,0,.18);align-items:center;justify-content:center;font-size:10px}
  .step.on .n{background:rgba(0,0,0,.25)}
  .sp{flex:1}
  .btn{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--ink2);color:var(--txt);border-radius:7px;padding:8px 12px;cursor:pointer}
  .btn:hover{border-color:var(--orange)}
  .btn.primary{background:var(--orange);color:var(--ink);border-color:var(--orange)}
  .main{display:flex;flex:1;min-height:0}
  .rail{width:300px;flex:none;background:var(--ink);border-right:1px solid var(--line);overflow-y:auto;padding:14px}
  .rail.right{border-right:0;border-left:1px solid var(--line)}
  .stagewrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:26px;background:#0D141A;min-width:0}
  .stage{position:relative;background:var(--ink);border:1px solid var(--line);flex:none;box-shadow:0 10px 50px rgba(0,0,0,.45)}
  .blk{position:absolute;cursor:grab;outline:1px dashed transparent}
  .blk:hover{outline-color:rgba(255,153,0,.5)}
  .blk.sel{outline:1.5px solid var(--orange)}
  .handle{position:absolute;right:-5px;bottom:-5px;width:11px;height:11px;background:var(--orange);border:1px solid #fff;border-radius:2px;cursor:nwse-resize}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#C7CDD6;margin:0 0 9px}
  .sec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
  label{display:block;font-size:11px;color:var(--muted);margin:9px 0 4px;font-weight:600}
  input[type=text],textarea,select,input[type=number]{width:100%;background:var(--ink2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 8px;font:inherit;font-size:12px}
  textarea{resize:vertical;min-height:42px}
  .row{display:flex;gap:8px}.row>div{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;border:1px solid var(--line);background:var(--ink2);color:#C7CDD6;border-radius:20px;padding:5px 10px;cursor:pointer;font-weight:600}
  .chip.on{background:var(--orange);color:var(--ink);border-color:var(--orange)}
  .blocks{list-style:none;margin:0 0 10px;padding:0}
  .blocks li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;font-size:12px;cursor:pointer}
  .blocks li.sel{border-color:var(--orange)}
  .blocks li .nm{flex:1;text-transform:capitalize}
  .tabsmini{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
  .tabsmini .t{font-size:11px;border:1px solid var(--line);background:var(--ink2);color:#C7CDD6;border-radius:6px;padding:5px 8px;cursor:pointer}
  .tabsmini .t.on{background:var(--orange);color:var(--ink);border-color:var(--orange);font-weight:800}
  .hint{font-size:11px;color:var(--muted);line-height:1.5;background:rgba(255,153,0,.06);border:1px solid rgba(255,153,0,.25);border-radius:8px;padding:9px 10px;margin-bottom:12px}
  .audcard{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px}
  .audcard .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .audcard .hd input{font-weight:700}
  .x{cursor:pointer;color:var(--muted);font-size:14px;padding:2px 6px;border:1px solid var(--line);border-radius:5px}
  .locblock{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
  .locblock .lc{font-size:10px;font-weight:800;color:var(--orange);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
  /* export */
  .export{flex:1;overflow:auto;padding:18px 22px;background:#0D141A}
  .grp{margin-bottom:22px}
  .grp h3{font-size:13px;margin:0 0 4px;color:#fff}
  .grp .lcrow{margin:10px 0 4px;font-size:11px;color:var(--orange);font-weight:800;letter-spacing:.8px;text-transform:uppercase}
  .frow{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
  .cell{text-align:center}
  .cell .tw{overflow:hidden;border:1px solid var(--line);background:var(--ink);display:inline-block}
  .cell .lab{font-size:10px;color:var(--muted);margin-top:4px}
  .anim{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .anim select,.anim input{width:auto}
  .swatch{display:flex;align-items:center;gap:6px}
  .swatch input[type=color]{width:30px;height:26px;padding:0;border-radius:5px;border:1px solid var(--line);background:none}
</style>
</head>

</div>

const baseBlock = id => S.blocks.find(b=>b.id===id);
const enabledSizeObjs = () => SIZES.filter(s=>S.enabledSizes.has(sizeKey(s)));
const activeSizeObj = () => S.activeSize==='master' ? S.master : (sizeFromKey(S.activeSize)||S.master);
const isMasterActive = () => S.activeSize==='master';

function propagate(b, T){
  const M=S.master, s=Math.min(T.w/M.w, T.h/M.h);
  const cx=(b.x+b.w/2)/M.w, cy=(b.y+b.h/2)/M.h;
  const w=b.w*s, h=b.h*s;
  let x=cx*T.w - w/2, y=cy*T.h - h/2;
  x=clamp(x,0,Math.max(0,T.w-w)); y=clamp(y,0,Math.max(0,T.h-h));
  return { x:Math.round(x), y:Math.round(y), w:Math.round(w), h:Math.round(h), fontPx:Math.max(8,Math.round((b.fontPx||14)*s)) };
}
function ovFor(key,id){ S.overrides[key]=S.overrides[key]||{}; S.overrides[key][id]=S.overrides[key][id]||{}; return S.overrides[key][id]; }
function store(id){
  const b=baseBlock(id);
  if(isMasterActive()) return { get:()=>({x:b.x,y:b.y,w:b.w,h:b.h,fontPx:b.fontPx,visible:true}), set:p=>Object.assign(b,p) };
  const o=ovFor(S.activeSize,id);
  return { get:()=>Object.assign(propagate(b,activeSizeObj()),o), set:p=>Object.assign(o,p) };
}
function txt(aud,loc){ return (S.content[aud]&&S.content[aud][loc]) ? S.content[aud][loc] : {}; }

// resolve one (audience, locale, size) into renderFreeform ctx
function ctxVariant(aud, loc, T, isMaster){
  const k = isMaster ? null : sizeKey(T);
  const blocks = S.blocks.map(b=>{
    const o = (k && S.overrides[k] && S.overrides[k][b.id]) ? S.overrides[k][b.id] : {};
    const geom = isMaster ? {x:b.x,y:b.y,w:b.w,h:b.h,fontPx:b.fontPx} : Object.assign(propagate(b,T), o);
    const visible = (o.visible!==undefined) ? o.visible : true;
    let text='', src, fit;
    const t = txt(aud,loc);
    if(b.type==='image'){ src=S.image.src; fit=S.image.fit; }
    else if(b.type==='logo'){ text=t.logo||'aws'; }
    else if(b.type==='headline'){ text = o.useShort ? (t.short||t.headline||'') : (t.headline||''); }
    else { text = t[b.type]||''; }
    return Object.assign({}, b, geom, {visible, text, src, fit, align:b.align});
  });
  return { brand:S.brand, size:T, click:S.click, anim:S.anim, locale:loc,
           title:'AWS – '+aud+' – '+loc+' – '+T.w+'x'+T.h, blocks };
}

function makeInteractive(el,handle,id){
  let mode=null,sx,sy,start;
  const down=(e,m)=>{mode=m;sx=e.clientX;sy=e.clientY;const st=store(id).get();start={x:st.x,y:st.y,w:st.w,h:st.h};el.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation();};
  const move=(e)=>{ if(!mode)return; const S0=activeSizeObj(),dx=e.clientX-sx,dy=e.clientY-sy;
    if(mode==='drag'){const nx=clamp(start.x+dx,0,S0.w-el.offsetWidth),ny=clamp(start.y+dy,0,S0.h-el.offsetHeight);el.style.left=nx+'px';el.style.top=ny+'px';store(id).set({x:Math.round(nx),y:Math.round(ny)});}
    else{const nw=clamp(start.w+dx,12,S0.w),nh=clamp(start.h+dy,10,S0.h);el.style.width=nw+'px';store(id).set({w:Math.round(nw)});const b=store(id).get();if(b.type==='image'||baseBlock(id).type==='image'||baseBlock(id).type==='cta'){el.style.height=nh+'px';store(id).set({h:Math.round(nh)});}}
    schedulePreview();
  };
  const up=(e)=>{mode=null;try{el.releasePointerCapture(e.pointerId);}catch(_){}};
  el.addEventListener('pointerdown',e=>down(e,'drag'));
  handle.addEventListener('pointerdown',e=>down(e,'resize'));
  el.addEventListener('pointermove',move);
  el.addEventListener('pointerup',up);
}

function field(aud,loc,f,label,val,small){

function toggleLocale(l){

async function doTranslate(){
  const btn=$('bTranslate'); btn.textContent='Translating…'; btn.disabled=true;
  const fields=['headline','short','subhead','proof','cta'];
  try{
    for(const a of S.audiences){ const en=S.content[a.id].en; if(!en)continue;
      for(const loc of S.locales){ if(loc==='en')continue;
        S.content[a.id][loc]=S.content[a.id][loc]||{};
        for(const f of fields){ const src=en[f]; if(!src)continue;
          try{ const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(src)+'&langpair=en|'+loc.split('-')[0]); const j=await r.json(); const out=j&&j.responseData&&j.responseData.translatedText; if(out) S.content[a.id][loc][f]=out; }catch(_){}}
      }
    }
    renderContent($('main'));
  } finally { btn.textContent='✦ Auto-translate EN → others'; btn.disabled=false; }

    ex.appendChild(g);
  });
  $('bZip2').onclick=downloadZip; $('bProj').onclick=exportProject;
  $('bReplay2').onclick=()=>document.querySelectorAll('.export iframe').forEach(f=>f.srcdoc=f.srcdoc);
  $('bImp').onchange=e=>importProject(e.target.files[0]);
  $('bSave').onclick=()=>{ if(saveLocal()) {} else alert('This browser/context blocks local save — use “Export project file” instead.'); };
  $('bFresh').onclick=()=>{ if(confirm('Start fresh? This clears the autosaved session in this browser. Export a project file first if you want to keep this work.')){ clearLocal(); location.reload(); } };
  const ss=$('saveState');
  if(ss) ss.textContent = !hasLS ? 'Local save unavailable here — use Export project file.'
        : (window.__restored ? 'Restored your last session. Autosaving as you work.' : 'Autosaving in this browser as you work.');
}

function allFiles(){
  const files=[];
  S.audiences.forEach(a=>S.locales.forEach(loc=>enabledSizeObjs().forEach(s=>{
    files.push({ name:a.id+'/'+loc+'/'+s.w+'x'+s.h+'/index.html', data:C.renderFreeform(ctxVariant(a.id,loc,s,false)) });
  })));
  return files;
}
function downloadZip(){ downloadFile('aws-banners.zip', makeZip(allFiles())); }
function serialize(){ const o=Object.assign({},S,{enabledSizes:[...S.enabledSizes]}); delete o.tab; delete o.selected; delete o.activeSize; return o; }
function applyProject(o){
  Object.keys(o).forEach(k=>{ if(k==='enabledSizes')S.enabledSizes=new Set(o[k]); else S[k]=o[k]; });
  S.tab='design'; S.activeSize='master'; S.selected='headline';
  if(!S.audiences.find(a=>a.id===S.designAud))S.designAud=S.audiences[0].id;
  if(!S.locales.includes(S.designLoc))S.designLoc=S.locales[0];
}
function exportProject(){ downloadFile('aws-banner-project.json', new Blob([JSON.stringify(serialize(),null,2)],{type:'application/json'})); }
function importProject(file){ if(!file)return; const r=new FileReader(); r.onload=()=>{ try{ applyProject(JSON.parse(r.result)); saveLocal(); renderSteps(); buildAnim(); renderMain(); }catch(err){alert('Could not read project file.');} }; r.readAsText(file); }

// ---- browser autosave: persists across refreshes when run locally or hosted; no-ops in a restricted preview ----
const LS_KEY='awsBannerStudio.v1';
const hasLS=(function(){try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(_){return false;}})();
function saveLocal(){ if(!hasLS)return false; try{ localStorage.setItem(LS_KEY,JSON.stringify(serialize())); const el=$('saveState'); if(el)el.textContent='Saved in this browser · '+new Date().toLocaleTimeString(); return true; }catch(_){return false;} }
function loadLocal(){ if(!hasLS)return null; try{ const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; }catch(_){return null;} }
function clearLocal(){ if(!hasLS)return; try{localStorage.removeItem(LS_KEY);}catch(_){} }

/* ============================= SHARED UTIL ============================= */
const schedulePreview=debounce(()=>{ saveLocal(); },800);
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return escHtml(s).replace(/"/g,'&quot;');}
function buildAnim(){
  const p=$('aPreset'); p.innerHTML=''; Object.keys(C.ANIMATIONS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=C.ANIMATIONS[k].label;p.appendChild(o);}); p.value=S.anim.preset;
  p.onchange=()=>{S.anim.preset=p.value;};
  $('aDur').value=S.anim.duration; $('aStag').value=S.anim.stagger;
  $('aDur').oninput=()=>{S.anim.duration=+$('aDur').value;};
  $('aStag').oninput=()=>{S.anim.stagger=+$('aStag').value;};
}
function loadImage(file,cb){ if(!file)return; const r=new FileReader(); r.onload=()=>{const img=new Image();img.onload=()=>{const max=800,sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL(/jpe?g/i.test(file.type)?'image/jpeg':'image/png',0.85));};img.src=r.result;};r.readAsDataURL(file); }
function downloadFile(name,content){ const blob=content instanceof Blob?content:new Blob([content]); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function makeZip(files){const enc=new TextEncoder(),chunks=[],central=[];let off=0;const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const lo=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    chunks.push(new Uint8Array(lo),name,data);
    const ce=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off));
    central.push(new Uint8Array(ce),name); off+=lo.length+name.length+data.length;});
  let cs=0;central.forEach(c=>cs+=c.length);const start=off;
  const eo=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cs),u32(start),u16(0)));
  const all=chunks.concat(central,[eo]);let tot=0;all.forEach(a=>tot+=a.length);const out=new Uint8Array(tot);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length;});return new Blob([out],{type:'application/zip'});}

/* topbar zip + replay also work from anywhere */
$('bZip').onclick=downloadZip;
$('bReplay').onclick=()=>document.querySelectorAll('iframe').forEach(f=>f.srcdoc=f.srcdoc);

const __saved=loadLocal();
if(__saved){ try{ applyProject(__saved); window.__restored=true; }catch(_){} }
if(hasLS){ window.addEventListener('beforeunload',saveLocal); document.addEventListener('visibilitychange',()=>{ if(document.hidden)saveLocal(); }); setInterval(saveLocal,5000); }
buildAnim(); renderSteps(); renderMain();
</script>
