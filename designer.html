<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AWS Banner Designer</title>
<script src="core/banner.js"></script>
<script src="core/default-hero.js"></script>
<style>
  :root{--ink:#232F3E;--ink2:#2C3A4A;--line:#3B4858;--orange:#FF9900;--muted:#8A95A3;--txt:#EDEFF2}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Helvetica Neue",system-ui,-apple-system,Arial,sans-serif;color:var(--txt);background:#11181F;height:100vh;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
  .topbar h1{font-size:14px;margin:0;font-weight:800;letter-spacing:-0.2px;margin-right:6px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tab{font-size:11px;border:1px solid var(--line);background:var(--ink2);color:#C7CDD6;border-radius:6px;padding:6px 9px;cursor:pointer}
  .tab.on{background:var(--orange);color:var(--ink);border-color:var(--orange);font-weight:800}
  .tab.master{font-weight:800}
  .sp{flex:1}
  .btn{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--ink2);color:var(--txt);border-radius:6px;padding:7px 11px;cursor:pointer}
  .btn:hover{border-color:var(--orange)}
  .btn.primary{background:var(--orange);color:var(--ink);border-color:var(--orange)}
  .main{display:flex;flex:1;min-height:0}
  .editor{flex:1;display:flex;flex-direction:column;min-width:0;background:#0D141A}
  .editwrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:30px}
  .stage{position:relative;background:var(--ink);border:1px solid var(--line);flex:none;box-shadow:0 8px 40px rgba(0,0,0,.4)}
  .blk{position:absolute;cursor:grab;outline:1px dashed transparent}
  .blk:hover{outline-color:rgba(255,153,0,.5)}
  .blk.sel{outline:1.5px solid var(--orange)}
  .handle{position:absolute;right:-5px;bottom:-5px;width:11px;height:11px;background:var(--orange);border:1px solid #fff;border-radius:2px;cursor:nwse-resize}
  .hint{font-size:11px;color:var(--muted);padding:8px 16px;border-top:1px solid var(--line);background:var(--ink)}
  .strip{flex:none;background:var(--ink);border-top:1px solid var(--line);padding:12px 16px;overflow-x:auto;white-space:nowrap}
  .thumb{display:inline-block;vertical-align:top;margin-right:18px;text-align:center;cursor:pointer}
  .thumb .tw{overflow:hidden;border:1px solid var(--line);background:var(--ink);display:inline-block}
  .thumb.cur .tw{border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,153,0,.4)}
  .thumb .lab{font-size:10px;color:var(--muted);margin-top:5px;font-weight:700}
  .panel{width:280px;flex:none;background:var(--ink);border-left:1px solid var(--line);overflow-y:auto;padding:14px}
  .panel h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#C7CDD6;margin:0 0 10px}
  label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input[type=text],textarea,select,input[type=number]{width:100%;background:var(--ink2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 8px;font:inherit;font-size:12px}
  textarea{resize:vertical;min-height:46px}
  .row{display:flex;gap:8px}.row>div{flex:1}
  .blocks{list-style:none;margin:0 0 14px;padding:0}
  .blocks li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;font-size:12px;cursor:pointer}
  .blocks li.sel{border-color:var(--orange)}
  .blocks li .nm{flex:1;text-transform:capitalize}
  .blocks li input{width:auto}
  .anim{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
  .anim select,.anim input{width:auto}
  .val{color:#C7CDD6;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>AWS Banner Designer</h1>
    <span style="font-size:11px;color:var(--muted)">Master</span>
    <select id="masterSize" style="width:auto;font-size:11px;padding:5px 7px;border-radius:6px;background:var(--ink2);color:var(--txt);border:1px solid var(--line)"></select>
    <div class="tabs" id="tabs"></div>
    <span class="sp"></span>
    <div class="anim">
      <span>Anim</span>
      <select id="aPreset"></select>
      <span>spd</span><input id="aDur" type="range" min="0" max="1000" step="50" style="width:70px">
      <span>stag</span><input id="aStag" type="range" min="0" max="700" step="50" style="width:70px">
    </div>
    <button class="btn" id="bReplay">▶ Replay</button>
    <button class="btn" id="bLayout">Export layout</button>
    <button class="btn primary" id="bZip">Download all (.zip)</button>
  </div>

  <div class="main">
    <div class="editor">
      <div class="editwrap"><div class="stage" id="stage"></div></div>
      <div class="hint" id="hint"></div>
      <div class="strip" id="strip"></div>
    </div>
    <div class="panel">
      <h2>Blocks</h2>
      <ul class="blocks" id="blockList"></ul>
      <div id="inspector"></div>
    </div>
  </div>
</div>

<script>
const C = window.BannerCore;
const SIZES = C.SIZES;
const sizeKey = s => s.w + 'x' + s.h;

const D = {
  master: { w:300, h:250 },
  brand: { colors:{ ink:'#232F3E', orange:'#FF9900', white:'#FFFFFF', hairline:'#3B4858' },
           fontStack:'"Amazon Ember","Helvetica Neue","Segoe UI",system-ui,Arial,sans-serif' },
  click: 'https://aws.amazon.com/bedrock/',
  anim: { preset:'fade-up', duration:450, stagger:300, loops:1 },
  activeSize: 'master',
  selected: 'headline',
  blocks: [
    { id:'logo',     type:'logo',     text:'aws', x:16, y:14, w:64, h:22, fontPx:16, align:'left', visible:true },
    { id:'image',    type:'image',    src: window.DEFAULT_HERO||'', fit:'contain', x:204, y:14, w:80, h:80, visible:true },
    { id:'headline', type:'headline', text:'Northwind shipped a fraud-detection agent in 6 weeks.', x:16, y:74, w:200, h:96, fontPx:19, align:'left', visible:true },
    { id:'subhead',  type:'subhead',  text:'Built on Amazon Bedrock.', x:16, y:150, w:200, h:26, fontPx:12, align:'left', visible:true },
    { id:'proof',    type:'proof',    text:'6 WEEKS TO PRODUCTION', x:16, y:180, w:160, h:20, fontPx:10, visible:true },
    { id:'cta',      type:'cta',      text:'Start building', x:16, y:210, w:120, h:28, fontPx:12, visible:true }
  ],
  overrides: {}   // { sizeKey: { blockId: {x,y,w,h,fontPx,visible} } }
};

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const debounce = (fn,ms) => { let t; return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}; };
const activeSizeObj = () => D.activeSize==='master' ? D.master : SIZES.find(s=>sizeKey(s)===D.activeSize) || D.master;

// propagate one base block (master px) to a target size
function propagate(b, T){
  const M = D.master;
  const s = Math.min(T.w/M.w, T.h/M.h);
  const cx = (b.x + b.w/2)/M.w, cy = (b.y + b.h/2)/M.h;
  const w = b.w*s, h = b.h*s;
  let x = cx*T.w - w/2, y = cy*T.h - h/2;
  x = clamp(x, 0, Math.max(0, T.w - w));
  y = clamp(y, 0, Math.max(0, T.h - h));
  return Object.assign({}, b, { x:Math.round(x), y:Math.round(y), w:Math.round(w), h:Math.round(h), fontPx: Math.max(8, Math.round((b.fontPx||14)*s)) });
}
// resolved blocks for a given size context ('master' or a size obj)
function resolvedBlocks(ctx){
  if (ctx === 'master' || (ctx && ctx.w===D.master.w && ctx.h===D.master.h && D.activeSize==='master')) {
    return D.blocks.map(b=>Object.assign({}, b));
  }
  const T = ctx;
  const ov = D.overrides[sizeKey(T)] || {};
  return D.blocks.map(b => Object.assign({}, propagate(b, T), ov[b.id] || {}));
}
function ctxFor(sizeObj){
  return { brand:D.brand, size:sizeObj, click:D.click, anim:D.anim, locale:'en',
           title:'AWS – '+sizeObj.w+'x'+sizeObj.h, blocks: resolvedBlocks(D.activeSize==='master'?'master':sizeObj) };
}

// ---- write geometry/props back to base (master) or per-size override ----
function targetBlockStore(id){
  if (D.activeSize === 'master') return { get:()=>D.blocks.find(b=>b.id===id), set:(p)=>Object.assign(D.blocks.find(b=>b.id===id), p) };
  const key = sizeKey(activeSizeObj());
  D.overrides[key] = D.overrides[key] || {};
  D.overrides[key][id] = D.overrides[key][id] || {};
  return { get:()=>Object.assign({}, propagate(D.blocks.find(b=>b.id===id), activeSizeObj()), D.overrides[key][id]),
           set:(p)=>Object.assign(D.overrides[key][id], p) };
}
function baseBlock(id){ return D.blocks.find(b=>b.id===id); }

// ---- styling mirror of core freeform (so editor is WYSIWYG) ----
function styleEl(el, b){
  const c = D.brand.colors;
  el.style.left=b.x+'px'; el.style.top=b.y+'px'; el.style.width=b.w+'px';
  el.style.color=''; el.style.background=''; el.style.border=''; el.style.borderRadius='';
  el.style.display='block'; el.style.padding=''; el.style.alignItems=''; el.style.justifyContent='';
  el.style.fontWeight=''; el.style.letterSpacing=''; el.style.lineHeight=''; el.style.whiteSpace='';
  el.style.textAlign=b.align||'left'; el.style.height='auto';
  if (b.type==='image'){ el.style.height=b.h+'px'; el.innerHTML='<img src="'+(b.src||'')+'" style="width:100%;height:100%;object-fit:'+(b.fit||'contain')+';display:block">'; return; }
  el.style.fontSize=b.fontPx+'px';
  if (b.type==='logo'){ el.style.fontWeight=800; el.style.letterSpacing='-0.5px'; el.style.lineHeight='1'; el.style.color=c.white; el.textContent=b.text; }
  else if (b.type==='cta'){ el.style.height=b.h+'px'; el.style.display='flex'; el.style.alignItems='center'; el.style.justifyContent='center'; el.style.background=c.orange; el.style.color=c.ink; el.style.fontWeight=800; el.style.borderRadius='3px'; el.style.whiteSpace='nowrap'; el.textContent=b.text; }
  else if (b.type==='proof'){ el.style.display='inline-block'; el.style.fontWeight=700; el.style.letterSpacing='0.6px'; el.style.color=c.orange; el.style.border='1px solid '+c.orange; el.style.borderRadius='2px'; el.style.padding='3px 7px'; el.style.whiteSpace='nowrap'; el.textContent=b.text; }
  else if (b.type==='subhead'){ el.style.fontWeight=500; el.style.lineHeight='1.2'; el.style.color='#D9DEE5'; el.textContent=b.text; }
  else { el.style.fontWeight=800; el.style.letterSpacing='-0.3px'; el.style.lineHeight='1.1'; el.style.color=c.white; el.textContent=b.text; }
}

// ---- editor canvas ----
const stage = $('stage');
function renderCanvas(){
  const S = activeSizeObj();
  stage.style.width=S.w+'px'; stage.style.height=S.h+'px';
  stage.innerHTML='';
  const blocks = resolvedBlocks(D.activeSize==='master'?'master':S);
  blocks.forEach(b=>{
    if (b.visible===false) return;
    const el=document.createElement('div'); el.className='blk'+(b.id===D.selected?' sel':'');
    styleEl(el, b);
    const handle=document.createElement('div'); handle.className='handle'; el.appendChild(handle);
    makeInteractive(el, handle, b.id);
    el.addEventListener('pointerdown', ()=>{ D.selected=b.id; renderBlockList(); renderInspector(); markSel(); });
    stage.appendChild(el);
  });
  $('hint').textContent = D.activeSize==='master'
    ? 'Editing the MASTER ('+S.w+'×'+S.h+'). Drag blocks; everything below auto-scales. Lock by switching to a size tab to nudge that one.'
    : 'Nudging '+S.w+'×'+S.h+' only — changes here override the auto-scale for this size. (Edits to copy still come from Master.)';
}
function markSel(){ [...stage.children].forEach(el=>el.classList.remove('sel')); }

function makeInteractive(el, handle, id){
  let mode=null, sx, sy, start;
  const onDown = (e, m) => {
    mode=m; sx=e.clientX; sy=e.clientY; const st=targetBlockStore(id).get();
    start={x:st.x,y:st.y,w:st.w,h:st.h}; el.setPointerCapture(e.pointerId);
    el.style.cursor = m==='drag'?'grabbing':'nwse-resize'; e.preventDefault(); e.stopPropagation();
  };
  const onMove = (e) => {
    if(!mode) return;
    const S=activeSizeObj(); const dx=e.clientX-sx, dy=e.clientY-sy;
    if(mode==='drag'){
      const nx=clamp(start.x+dx,0,S.w-el.offsetWidth), ny=clamp(start.y+dy,0,S.h-el.offsetHeight);
      el.style.left=nx+'px'; el.style.top=ny+'px'; targetBlockStore(id).set({x:Math.round(nx),y:Math.round(ny)});
    } else {
      const nw=clamp(start.w+dx,12,S.w), nh=clamp(start.h+dy,10,S.h);
      el.style.width=nw+'px'; targetBlockStore(id).set({w:Math.round(nw)});
      const b=targetBlockStore(id).get();
      if(b.type==='image'||b.type==='cta'){ el.style.height=nh+'px'; targetBlockStore(id).set({h:Math.round(nh)}); }
    }
    refreshThumbs();
  };
  const onUp = (e)=>{ mode=null; el.style.cursor='grab'; try{el.releasePointerCapture(e.pointerId);}catch(_){}}; 
  el.addEventListener('pointerdown', e=>onDown(e,'drag'));
  handle.addEventListener('pointerdown', e=>onDown(e,'resize'));
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
}

// ---- block list + inspector ----
function renderBlockList(){
  const ul=$('blockList'); ul.innerHTML='';
  D.blocks.forEach(b=>{
    const li=document.createElement('li'); if(b.id===D.selected) li.className='sel';
    const cb=document.createElement('input'); cb.type='checkbox';
    // visibility: per-size when nudging, base when master
    const vis = D.activeSize==='master' ? (b.visible!==false) : (resolvedBlocks(activeSizeObj()).find(x=>x.id===b.id).visible!==false);
    cb.checked=vis;
    cb.onclick=(e)=>{ e.stopPropagation(); targetBlockStore(b.id).set({visible:cb.checked}); renderCanvas(); refreshThumbs(); };
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=b.type;
    li.appendChild(cb); li.appendChild(nm);
    li.onclick=()=>{ D.selected=b.id; renderBlockList(); renderInspector(); renderCanvas(); };
    ul.appendChild(li);
  });
}
function renderInspector(){
  const b=baseBlock(D.selected); const ins=$('inspector'); if(!b){ins.innerHTML='';return;}
  let h='<h2>'+b.type+'</h2>';
  if(b.type==='image'){
    h+='<label>Image</label><input type="file" id="iImg" accept="image/*" style="font-size:11px">';
    h+='<label>Fit</label><select id="iFit"><option value="contain">contain</option><option value="cover">cover</option></select>';
  } else {
    h+='<label>Text</label><textarea id="iText"></textarea>';
    h+='<label>Font size <span class="val" id="iFontV"></span></label><input type="range" id="iFont" min="8" max="60" step="1">';
    if(b.type!=='proof'&&b.type!=='cta'){ h+='<label>Align</label><select id="iAlign"><option>left</option><option>center</option><option>right</option></select>'; }
  }
  ins.innerHTML=h;
  if(b.type==='image'){
    $('iFit').value=b.fit||'contain'; $('iFit').onchange=()=>{ b.fit=$('iFit').value; renderCanvas(); refreshThumbs(); };
    $('iImg').onchange=e=>loadImage(e.target.files[0],uri=>{ b.src=uri; renderCanvas(); refreshThumbs(); });
  } else {
    $('iText').value=b.text||''; $('iText').oninput=()=>{ b.text=$('iText').value; renderCanvas(); refreshThumbs(); };
    const store=targetBlockStore(b.id).get();
    $('iFont').value=store.fontPx||b.fontPx; $('iFontV').textContent=($('iFont').value)+'px';
    $('iFont').oninput=()=>{ $('iFontV').textContent=$('iFont').value+'px'; targetBlockStore(b.id).set({fontPx:+$('iFont').value}); renderCanvas(); refreshThumbs(); };
    if($('iAlign')){ $('iAlign').value=b.align||'left'; $('iAlign').onchange=()=>{ b.align=$('iAlign').value; renderCanvas(); refreshThumbs(); }; }
  }
}

// ---- size tabs + master picker + thumbnails ----
function renderTabs(){
  const t=$('tabs'); t.innerHTML='';
  const mk=(label,key,cls)=>{ const d=document.createElement('div'); d.className='tab '+(cls||'')+(D.activeSize===key?' on':''); d.textContent=label; d.onclick=()=>{ D.activeSize=key; renderTabs(); renderCanvas(); renderBlockList(); renderInspector(); markCurThumb(); }; t.appendChild(d); };
  mk('● Master','master','master');
  SIZES.forEach(s=>mk(s.w+'×'+s.h, sizeKey(s)));
}
function buildMasterPicker(){
  const sel=$('masterSize'); SIZES.forEach(s=>{ const o=document.createElement('option'); o.value=sizeKey(s); o.textContent=s.w+'×'+s.h; sel.appendChild(o); });
  sel.value=sizeKey(D.master);
  sel.onchange=()=>{ const s=SIZES.find(x=>sizeKey(x)===sel.value); D.master={w:s.w,h:s.h}; D.overrides={}; if(D.activeSize!=='master')D.activeSize='master'; renderTabs(); renderCanvas(); refreshThumbs(); };
}
const refreshThumbs = debounce(()=>{
  const strip=$('strip'); strip.innerHTML='';
  SIZES.forEach(s=>{
    const k=180/s.w, scale=Math.min(k, 90/s.h, 1);
    const wrap=document.createElement('div'); wrap.className='thumb'+(D.activeSize===sizeKey(s)?' cur':'');
    const tw=document.createElement('div'); tw.className='tw'; tw.style.width=Math.round(s.w*scale)+'px'; tw.style.height=Math.round(s.h*scale)+'px';
    const fr=document.createElement('iframe'); fr.width=s.w; fr.height=s.h; fr.scrolling='no'; fr.style.border='0';
    fr.style.transformOrigin='top left'; fr.style.transform='scale('+scale+')';
    fr.srcdoc = C.renderFreeform(ctxFor(s));
    tw.appendChild(fr);
    const lab=document.createElement('div'); lab.className='lab'; lab.textContent=s.w+'×'+s.h;
    wrap.appendChild(tw); wrap.appendChild(lab);
    wrap.onclick=()=>{ D.activeSize=sizeKey(s); renderTabs(); renderCanvas(); renderBlockList(); renderInspector(); markCurThumb(); };
    strip.appendChild(wrap);
  });
},160);
function markCurThumb(){ refreshThumbs(); }

// ---- animation controls ----
function buildAnim(){
  const p=$('aPreset'); Object.keys(C.ANIMATIONS).forEach(k=>{ const o=document.createElement('option');o.value=k;o.textContent=C.ANIMATIONS[k].label;p.appendChild(o);});
  p.value=D.anim.preset; p.onchange=()=>{D.anim.preset=p.value;refreshThumbs();};
  $('aDur').value=D.anim.duration; $('aStag').value=D.anim.stagger;
  $('aDur').oninput=()=>{D.anim.duration=+$('aDur').value;refreshThumbs();};
  $('aStag').oninput=()=>{D.anim.stagger=+$('aStag').value;refreshThumbs();};
}

// ---- image loader (downscale) ----
function loadImage(file,cb){ if(!file)return; const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=700,sc=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); cb(cv.toDataURL(/jpe?g/i.test(file.type)?'image/jpeg':'image/png',0.85)); }; img.src=r.result; }; r.readAsDataURL(file); }

// ---- export ----
function downloadFile(name,content,mime){ const blob=content instanceof Blob?content:new Blob([content],{type:mime}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
$('bReplay').onclick=()=>document.querySelectorAll('#strip iframe').forEach(f=>f.srcdoc=f.srcdoc);
$('bLayout').onclick=()=>downloadFile('layout.json', JSON.stringify({master:D.master,blocks:D.blocks,overrides:D.overrides,anim:D.anim},null,2),'application/json');
$('bZip').onclick=()=>{ const files=SIZES.map(s=>({name:s.w+'x'+s.h+'/index.html', data:C.renderFreeform(ctxFor(s))})); downloadFile('aws-banners-designed.zip', makeZip(files), 'application/zip'); };

// pure-JS store zip
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){const enc=new TextEncoder(),chunks=[],central=[];let off=0;const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const lo=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    chunks.push(new Uint8Array(lo),name,data);
    const ce=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off));
    central.push(new Uint8Array(ce),name); off+=lo.length+name.length+data.length;});
  let cs=0;central.forEach(c=>cs+=c.length);const start=off;
  const eo=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cs),u32(start),u16(0)));
  const all=chunks.concat(central,[eo]);let tot=0;all.forEach(a=>tot+=a.length);const out=new Uint8Array(tot);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length});return new Blob([out],{type:'application/zip'});}

// ---- go ----
